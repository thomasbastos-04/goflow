name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod tidy
      - run: go test ./... -race -cover
      - run: go vet ./...
      - run: docker build --build-arg APP=api -t goflow-api .
      - run: docker build --build-arg APP=worker -t goflow-worker .
